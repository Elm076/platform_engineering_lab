# Development stack configuration (introduced in Step 5).
# Note: For this demo, dev and prod share the same GCP project with `-{stack}`
# resource name suffixes. In production, set a SEPARATE `gcp:project` per stack!
#
# Before running:
#   pulumi stack init dev
#   pulumi config set gcp:project YOUR_GCP_PROJECT_ID
config:
  gcp:region: europe-west4
  devfest-jaen-platform:manage_registry: "false"
  devfest-jaen-platform:greeting: "Hola DevFest Jaen 2026 from DEV Secret Manager!"
  devfest-jaen-platform:min_instances: "0"
  devfest-jaen-platform:max_instances: "3"
  devfest-jaen-platform:team: "platform"
  devfest-jaen-platform:cost_center: "cc-101"
